    <h1>用戶資料刪除說明</h1>
    <p>如果您希望刪除您的個人資料，請按照以下步驟操作：</p>
    
    <h2>步驟 1：</h2>
    <p>請發送電子郵件至 <strong>contact@yourwebsite.com</strong>，並提供以下資訊：</p>
    <ul>
        <li>您的 Facebook 用戶 ID</li>
        <li>您希望刪除的數據類型（例如：所有留言、帳戶數據）</li>
    </ul>

    <h2>步驟 2：</h2>
    <p>我們會在 48 小時內處理您的請求，並通知您刪除結果。</p>

    <p>如果您有任何疑問，請聯絡我們：📧 contact@yourwebsite.com</p>
